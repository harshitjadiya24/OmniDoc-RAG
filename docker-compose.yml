# RegRAG: API + web app. Copy .env.example to .env and set SECRET_KEY (and a model key) first.
services:
  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      CORS_ORIGINS: ${PUBLIC_WEB_URL:-http://localhost:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - library:/app/data/library
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  library:
